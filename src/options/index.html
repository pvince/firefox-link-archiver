<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchiveBox Auto-Sync Settings</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
          Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px 20px;
        text-align: center;
      }

      header h1 {
        font-size: 24px;
        margin-bottom: 5px;
      }

      header p {
        font-size: 14px;
        opacity: 0.9;
      }

      .content {
        padding: 30px 20px;
      }

      .section {
        margin-bottom: 30px;
      }

      .section h2 {
        font-size: 16px;
        color: #333;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 2px solid #f0f0f0;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        color: #555;
        margin-bottom: 5px;
      }

      input[type='text'],
      input[type='password'] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        font-family: inherit;
        transition: border-color 0.2s;
      }

      input[type='text']:focus,
      input[type='password']:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .button-group {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }

      button {
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        flex: 1;
      }

      .btn-test {
        background: #4CAF50;
        color: white;
      }

      .btn-test:hover {
        background: #45a049;
      }

      .btn-save {
        background: #667eea;
        color: white;
      }

      .btn-save:hover:not(:disabled) {
        background: #5568d3;
      }

      .btn-save:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .status {
        margin-top: 10px;
        padding: 10px;
        border-radius: 6px;
        font-size: 14px;
        display: none;
      }

      .status.success {
        display: block;
        background: #c8e6c9;
        color: #2e7d32;
        border-left: 4px solid #2e7d32;
      }

      .status.error {
        display: block;
        background: #ffcdd2;
        color: #c62828;
        border-left: 4px solid #c62828;
      }

      .status.loading {
        display: block;
        background: #bbdefb;
        color: #1565c0;
        border-left: 4px solid #1565c0;
      }

      .queue-status {
        background: #f5f5f5;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 15px;
      }

      .queue-status-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .queue-status-item:last-child {
        margin-bottom: 0;
      }

      .queue-status-label {
        color: #666;
        font-weight: 500;
      }

      .queue-status-value {
        color: #333;
        font-weight: bold;
      }

      .btn-sync {
        width: 100%;
        background: #ff9800;
        color: white;
        margin-top: 10px;
      }

      .btn-sync:hover {
        background: #f57c00;
      }

      .logs-container {
        background: #f5f5f5;
        border-radius: 6px;
        padding: 12px;
        max-height: 300px;
        overflow-y: auto;
        font-family: 'Courier New', monospace;
        font-size: 12px;
        line-height: 1.5;
      }

      .log-entry {
        margin-bottom: 8px;
        padding: 8px;
        background: white;
        border-left: 3px solid #ccc;
        border-radius: 3px;
      }

      .log-entry.debug {
        border-left-color: #2196f3;
      }

      .log-entry.info {
        border-left-color: #4caf50;
      }

      .log-entry.warn {
        border-left-color: #ff9800;
      }

      .log-entry.error {
        border-left-color: #f44336;
      }

      .log-time {
        color: #999;
        font-size: 11px;
      }

      .log-level {
        display: inline-block;
        width: 50px;
        font-weight: bold;
        margin-right: 8px;
      }

      .log-level.debug {
        color: #2196f3;
      }

      .log-level.info {
        color: #4caf50;
      }

      .log-level.warn {
        color: #ff9800;
      }

      .log-level.error {
        color: #f44336;
      }

      @media (max-width: 600px) {
        .container {
          margin: 0;
          border-radius: 0;
        }

        body {
          padding: 0;
        }

        header {
          padding: 20px 15px;
        }

        .content {
          padding: 20px 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>📚 ArchiveBox Auto-Sync</h1>
        <p>Configure your ArchiveBox connection</p>
      </header>

      <div class="content">
        <!-- Configuration Section -->
        <div class="section">
          <h2>Configuration</h2>

          <div class="form-group">
            <label for="archiveBoxUrl">ArchiveBox URL</label>
            <input
              type="text"
              id="archiveBoxUrl"
              placeholder="e.g., http://localhost:8000"
            />
          </div>

          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="ArchiveBox username" />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="ArchiveBox password" />
          </div>

          <div class="button-group">
            <button class="btn-test" id="testBtn">Test Connection</button>
            <button class="btn-save" id="saveBtn" disabled>Save</button>
          </div>

          <div id="connectionStatus" class="status"></div>
        </div>

        <!-- Queue Status Section -->
        <div class="section">
          <h2>Queue Status</h2>
          <div class="queue-status">
            <div class="queue-status-item">
              <span class="queue-status-label">Queued URLs:</span>
              <span class="queue-status-value" id="queueSize">0</span>
            </div>
            <div class="queue-status-item">
              <span class="queue-status-label">Last Sync:</span>
              <span class="queue-status-value" id="lastSync">Never</span>
            </div>
          </div>
          <button class="btn-sync" id="syncBtn">Sync Now</button>
        </div>

        <!-- Debug Logs Section -->
        <div class="section">
          <h2>Debug Logs</h2>
          <div id="logsContainer" class="logs-container">
            <div style="color: #999; text-align: center;">No logs yet</div>
          </div>
        </div>
      </div>
    </div>

    <script src="../../dist/options/index.js"></script>
  </body>
</html>
